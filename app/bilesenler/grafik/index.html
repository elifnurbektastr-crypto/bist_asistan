<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>BIST grafik</title>
  <style>
    :root { --metin: #0b0b0b; --ikincil: #52514e; --kenar: #d9d8d3; --zemin: #fcfcfb; --vurgu: #2a78d6; --dugme: #fff; }
    body.koyu { --metin: #f0efec; --ikincil: #c3c2b7; --kenar: #3a3a37; --zemin: #1a1a19; --vurgu: #3987e5; --dugme: #262624; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Source Sans Pro", system-ui, sans-serif; color: var(--metin); background: var(--zemin); }
    #arac-cubugu { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 4px 0 8px; }
    button, .dugme { font: inherit; font-size: 13px; padding: 5px 10px; border: 1px solid var(--kenar); border-radius: 6px;
                     background: var(--dugme); color: var(--metin); cursor: pointer; line-height: 1.2; }
    button:hover, .dugme:hover { border-color: var(--vurgu); }
    button.aktif { background: var(--vurgu); border-color: var(--vurgu); color: #fff; }
    button:focus-visible, .dugme:focus-within { outline: 2px solid var(--vurgu); outline-offset: 1px; }
    .ayrac { width: 1px; height: 22px; background: var(--kenar); margin: 0 4px; }
    #durum { font-size: 12px; color: var(--ikincil); margin-left: 6px; }
    #ipucu { font-size: 12px; color: var(--ikincil); padding: 0 0 4px; min-height: 16px; }
    /* Telefon: düğmelerde sadece simge, daha sıkı yerleşim */
    @media (max-width: 640px) {
      .etiket { display: none; }
      button, .dugme { padding: 6px 9px; font-size: 15px; }
      #arac-cubugu { gap: 4px; }
      .ayrac { display: none; }
      #durum { width: 100%; margin-left: 0; }
    }
  </style>
  <script src="plotly.min.js"></script>
</head>
<body>
  <div id="arac-cubugu" role="toolbar" aria-label="Çizim araçları">
    <button data-mod="incele" title="Dokunduğun mumun bilgisi; sayfa kaydırılabilir" aria-label="İncele">👆<span class="etiket"> İncele</span></button>
    <button data-mod="pan" title="Grafiği sürükle, tekerlekle yakınlaştır" aria-label="Kaydır">✋<span class="etiket"> Kaydır</span></button>
    <button data-mod="drawline" title="İki nokta arasında çizgi" aria-label="Trend çizgisi">📈<span class="etiket"> Trend çizgisi</span></button>
    <button data-mod="yatay" title="Fiyat grafiğine tıkla: o seviyede yatay çizgi" aria-label="Yatay çizgi">➖<span class="etiket"> Yatay çizgi</span></button>
    <button data-mod="drawrect" title="Sürükleyerek bölge işaretle" aria-label="Bölge">▭<span class="etiket"> Bölge</span></button>
    <button data-mod="drawopenpath" title="Serbest çizim" aria-label="Serbest çizim">✏️<span class="etiket"> Serbest</span></button>
    <span class="ayrac"></span>
    <button id="sil" title="Önce bir çizime tıklayıp seç, sonra sil" aria-label="Seçiliyi sil">🧽<span class="etiket"> Seçiliyi sil</span></button>
    <button id="temizle" title="Bu hissedeki tüm çizimleri sil" aria-label="Tümünü sil">🗑️<span class="etiket"> Tümünü sil</span></button>
    <span class="ayrac"></span>
    <button id="indir" title="Bu hissenin çizimlerini JSON dosyası olarak indir" aria-label="JSON indir">⬇️<span class="etiket"> JSON indir</span></button>
    <label class="dugme" title="Daha önce indirdiğin JSON dosyasını yükle" aria-label="JSON yükle">⬆️<span class="etiket"> JSON yükle</span>
      <input type="file" id="yukle" accept=".json,application/json" hidden>
    </label>
    <span id="durum" aria-live="polite"></span>
  </div>
  <div id="ipucu"></div>
  <div id="grafik"></div>
  <script src="grafik.js"></script>
</body>
</html>
