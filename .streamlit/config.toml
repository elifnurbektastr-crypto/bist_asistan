# Tema: cihazın açık/karanlık ayarına otomatik uyar (kullanıcı menüden de değiştirebilir)
[theme.light]
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f2f1ee"
textColor = "#0b0b0b"

[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#1a1a19"
secondaryBackgroundColor = "#262624"
textColor = "#f0efec"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"   # Deploy düğmesi gizli; menüden tema (açık/karanlık) seçilebilir
